# OWASP ZAP Full Scan rule configuration.
# Full scan performs active checks. Use only against local OWASP Juice Shop.
#
# This demo repository keeps active scan report-oriented.
# For a real project, selected Medium/High findings should be promoted to FAIL.
10010   WARN    (Cookie No HttpOnly Flag)
10011   WARN    (Cookie Without Secure Flag)
10015   WARN    (Incomplete or No Cache-control and Pragma HTTP Header Set)
10020   WARN    (X-Frame-Options Header Scanner)
10021   WARN    (X-Content-Type-Options Header Missing)
10023   WARN    (Information Disclosure - Debug Error Messages)
10038   WARN    (Content Security Policy Header Not Set)
40012   WARN    (Cross Site Scripting Reflected)
40014   WARN    (Absence of Anti-CSRF Tokens)
40018   WARN    (SQL Injection)
90022   WARN    (Application Error Disclosure)
