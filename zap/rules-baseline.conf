# OWASP ZAP Baseline Scan rule configuration.
# Format:
# <rule-id> <level> <description>
#
# Levels:
# IGNORE - ignore the rule
# INFO   - report as informational
# WARN   - report as warning
# FAIL   - fail the scan if this rule is found
#
# This repository scans OWASP Juice Shop, an intentionally vulnerable app.
# Therefore, baseline scan is report-oriented and does not fail CI on warnings.
10010   WARN    (Cookie No HttpOnly Flag)
10011   WARN    (Cookie Without Secure Flag)
10012   WARN    (Password Autocomplete in Browser)
10015   WARN    (Incomplete or No Cache-control and Pragma HTTP Header Set)
10016   INFO    (Web Browser XSS Protection Not Enabled - obsolete browser header)
10017   WARN    (Cross-Domain JavaScript Source File Inclusion)
10019   WARN    (Content-Type Header Missing)
10020   WARN    (X-Frame-Options Header Scanner)
10021   WARN    (X-Content-Type-Options Header Missing)
10023   WARN    (Information Disclosure - Debug Error Messages)
10024   WARN    (Information Disclosure - Sensitive Information in URL)
10025   WARN    (Information Disclosure - Sensitive Information in HTTP Referrer Header)
10027   WARN    (Information Disclosure - Suspicious Comments)
10038   WARN    (Content Security Policy Header Not Set)
10096   INFO    (Timestamp Disclosure)
40014   WARN    (Absence of Anti-CSRF Tokens)
90022   WARN    (Application Error Disclosure)
